name: Deploy webhook gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webhook-gateway-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install hash-locked test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Compile infrastructure template
        run: az bicep build --file infra/bicep/webhook-gateway.bicep

      - name: Build immutable deployment package
        run: |
          mkdir -p package/.python_packages/lib/site-packages
          python -m pip install --require-hashes --only-binary=:all: \
            --target=package/.python_packages/lib/site-packages \
            -r requirements.txt
          cp function_app.py host.json requirements.txt package/
          cp -R src schemas package/
          tar -czf webhook-gateway.tgz -C package .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webhook-gateway-package
          path: webhook-gateway.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webhook-gateway-package
          path: artifact

      - name: Extract reviewed package
        run: |
          mkdir package
          tar -xzf artifact/webhook-gateway.tgz -C package

      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@02a16c5f3a5707fa97fca56c202cc2ef6cc7dccb # v1.5.4
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: package